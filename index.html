<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        PaceFetch — Football Predictions Backed by Data
    </title>

    <meta
        name="description"
        content="PaceFetch provides football predictions backed by data, probability analysis and confidence rankings."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="canonical"
        href="https://pacefetchsport.vercel.app/"
    >

    <meta
        property="og:title"
        content="PaceFetch — Football Predictions"
    >

    <meta
        property="og:description"
        content="Football predictions backed by data."
    >

    <meta
        property="og:type"
        content="website"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <style>

        /* =========================================================
           PACEFETCH HOMEPAGE DESIGN
           ========================================================= */

        :root {
            --pf-bg: #06110d;
            --pf-bg-soft: #091812;
            --pf-card: #0c1d16;
            --pf-card-2: #10251c;
            --pf-border: rgba(255,255,255,.08);
            --pf-border-strong: rgba(255,255,255,.13);
            --pf-text: #f2f8f4;
            --pf-muted: #91a69b;
            --pf-green: #35d07f;
            --pf-green-dark: #123c29;
            --pf-lime: #b7ed69;
            --pf-amber: #f3b84b;
            --pf-red: #f06a6a;
            --pf-container: 1180px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(53,208,127,.10),
                    transparent 34%
                ),
                var(--pf-bg);
            color: var(--pf-text);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            line-height: 1.55;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .pf-container {
            width: min(
                calc(100% - 32px),
                var(--pf-container)
            );
            margin-inline: auto;
        }


        /* =========================================================
           HEADER
           ========================================================= */

        .pf-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--pf-border);
            background: rgba(6,17,13,.92);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .pf-header-inner {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .pf-wordmark {
            display: inline-flex;
            align-items: center;
            font-size: 1.38rem;
            font-weight: 800;
            letter-spacing: -.045em;
            color: #fff;
            position: relative;
            white-space: nowrap;
        }

        .pf-wordmark::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 34%;
            height: 2px;
            border-radius: 99px;
            background: var(--pf-green);
            animation: pfWordmarkLine 2.8s ease-in-out infinite;
        }

        @keyframes pfWordmarkLine {
            0%,
            100% {
                width: 30%;
                opacity: .55;
            }

            50% {
                width: 72%;
                opacity: 1;
            }
        }

        .pf-nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .pf-nav a {
            color: var(--pf-muted);
            font-size: .9rem;
            font-weight: 600;
            transition:
                color .2s ease,
                transform .2s ease;
        }

        .pf-nav a:hover,
        .pf-nav a.active {
            color: #fff;
        }

        .pf-nav a:hover {
            transform: translateY(-1px);
        }

        .pf-mobile-button {
            width: 42px;
            height: 42px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--pf-border-strong);
            border-radius: 12px;
            background: rgba(255,255,255,.03);
            color: #fff;
            cursor: pointer;
        }

        .pf-mobile-button svg {
            width: 20px;
            height: 20px;
        }

        .pf-mobile-menu {
            display: none;
            border-top: 1px solid var(--pf-border);
        }

        .pf-mobile-menu.is-open {
            display: block;
        }

        .pf-mobile-menu a {
            display: block;
            padding: 14px 0;
            color: var(--pf-muted);
            font-weight: 600;
            border-bottom: 1px solid var(--pf-border);
        }


        /* =========================================================
           HERO
           ========================================================= */

        .pf-hero {
            padding:
                92px 0
                70px;
            text-align: center;
        }

        .pf-live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border: 1px solid rgba(53,208,127,.22);
            border-radius: 999px;
            background: rgba(53,208,127,.07);
            color: var(--pf-green);
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .09em;
            text-transform: uppercase;
        }

        .pf-live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--pf-green);
            box-shadow:
                0 0 0 5px rgba(53,208,127,.08);
            animation: pfPulse 1.8s ease-in-out infinite;
        }

        @keyframes pfPulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .55;
                transform: scale(.8);
            }
        }

        .pf-hero h1 {
            max-width: 820px;
            margin:
                24px auto
                18px;
            font-size:
                clamp(2.25rem, 6vw, 4.65rem);
            line-height: 1.03;
            letter-spacing: -.065em;
            font-weight: 850;
        }

        .pf-hero h1 span {
            color: var(--pf-green);
        }

        .pf-hero p {
            max-width: 650px;
            margin: 0 auto;
            color: var(--pf-muted);
            font-size:
                clamp(.98rem, 2vw, 1.08rem);
        }

        .pf-hero-actions {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .pf-button {
            min-height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 0 18px;
            border-radius: 12px;
            border: 1px solid transparent;
            font-size: .88rem;
            font-weight: 750;
            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease;
        }

        .pf-button:hover {
            transform: translateY(-2px);
        }

        .pf-button-primary {
            background: var(--pf-green);
            color: #04110a;
        }

        .pf-button-primary:hover {
            background: #48dc8d;
        }

        .pf-button-secondary {
            border-color: var(--pf-border-strong);
            background: rgba(255,255,255,.03);
            color: #fff;
        }

        .pf-button-secondary:hover {
            background: rgba(255,255,255,.06);
        }


        /* =========================================================
           STATS
           ========================================================= */

        .pf-stats {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 72px;
        }

        .pf-stat {
            padding: 24px;
            text-align: center;
            border: 1px solid var(--pf-border);
            border-radius: 18px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.035),
                    rgba(255,255,255,.015)
                );
        }

        .pf-stat-value {
            display: block;
            font-size: 1.8rem;
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -.04em;
        }

        .pf-stat-label {
            display: block;
            margin-top: 7px;
            color: var(--pf-muted);
            font-size: .78rem;
        }


        /* =========================================================
           SECTION
           ========================================================= */

        .pf-section {
            padding-bottom: 76px;
        }

        .pf-section-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 24px;
        }

        .pf-section-kicker {
            display: block;
            margin-bottom: 6px;
            color: var(--pf-green);
            font-size: .7rem;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .pf-section-heading h2 {
            margin: 0;
            font-size:
                clamp(1.45rem, 3vw, 2rem);
            line-height: 1.15;
            letter-spacing: -.04em;
        }

        .pf-section-heading p {
            max-width: 620px;
            margin: 9px 0 0;
            color: var(--pf-muted);
            font-size: .9rem;
        }

        .pf-section-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--pf-green);
            font-size: .82rem;
            font-weight: 750;
            white-space: nowrap;
        }


        /* =========================================================
           SEARCH
           ========================================================= */

        .pf-search {
            position: relative;
            width: min(100%, 360px);
            margin-bottom: 14px;
        }

        .pf-search svg {
            position: absolute;
            left: 14px;
            top: 50%;
            width: 17px;
            height: 17px;
            transform: translateY(-50%);
            color: var(--pf-muted);
            pointer-events: none;
        }

        .pf-search input {
            width: 100%;
            height: 46px;
            padding:
                0 14px
                0 42px;
            border:
                1px solid var(--pf-border-strong);
            border-radius: 12px;
            outline: none;
            background: rgba(255,255,255,.035);
            color: #fff;
        }

        .pf-search input::placeholder {
            color: #6f8479;
        }

        .pf-search input:focus {
            border-color:
                rgba(53,208,127,.5);
            box-shadow:
                0 0 0 3px
                rgba(53,208,127,.08);
        }


        /* =========================================================
           FILTERS
           ========================================================= */

        .pf-filters {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }

        .pf-filter {
            position: relative;
        }

        .pf-filter select {
            width: 100%;
            height: 46px;
            padding:
                0 44px
                0 14px;
            border:
                1px solid var(--pf-border-strong);
            border-radius: 12px;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            background:
                rgba(255,255,255,.035);
            color: #eaf2ed;
            cursor: pointer;
        }

        .pf-filter select:focus {
            border-color:
                rgba(53,208,127,.5);
            box-shadow:
                0 0 0 3px
                rgba(53,208,127,.08);
        }

        .pf-filter select option {
            background: #0b1913;
            color: #fff;
        }

        .pf-filter-chevron {
            position: absolute;
            right: 15px;
            top: 50%;
            width: 17px;
            height: 17px;
            transform: translateY(-50%);
            color: var(--pf-muted);
            pointer-events: none;
        }


        /* =========================================================
           PREDICTION GRID
           ========================================================= */

        .pf-prediction-grid {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 14px;
        }

        .pf-prediction-card {
            padding: 19px;
            border:
                1px solid var(--pf-border);
            border-radius: 17px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.04),
                    rgba(255,255,255,.018)
                );
            cursor: pointer;
            transition:
                border-color .2s ease,
                transform .2s ease,
                background .2s ease;
        }

        .pf-prediction-card:hover {
            transform: translateY(-3px);
            border-color:
                rgba(53,208,127,.3);
            background:
                linear-gradient(
                    145deg,
                    rgba(53,208,127,.07),
                    rgba(255,255,255,.02)
                );
        }

        .pf-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .pf-league {
            overflow: hidden;
            color: var(--pf-muted);
            font-size: .72rem;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pf-confidence {
            flex-shrink: 0;
            padding: 5px 8px;
            border-radius: 8px;
            font-size: .72rem;
            font-weight: 800;
        }

        .pf-confidence.strong,
        .pf-tier.strong,
        .pf-pick-percent.strong {
            color: var(--pf-green);
            background: rgba(53,208,127,.10);
        }

        .pf-confidence.good,
        .pf-tier.good,
        .pf-pick-percent.good {
            color: var(--pf-lime);
            background: rgba(183,237,105,.09);
        }

        .pf-confidence.moderate,
        .pf-tier.moderate,
        .pf-pick-percent.moderate {
            color: var(--pf-amber);
            background: rgba(243,184,75,.09);
        }

        .pf-confidence.weak,
        .pf-tier.weak,
        .pf-pick-percent.weak {
            color: var(--pf-red);
            background: rgba(240,106,106,.09);
        }

        .pf-match-teams {
            display: grid;
            grid-template-columns:
                1fr auto 1fr;
            align-items: center;
            gap: 10px;
            margin: 24px 0;
            text-align: center;
        }

        .pf-team {
            min-width: 0;
        }

        .pf-team strong {
            display: block;
            overflow: hidden;
            font-size: .91rem;
            line-height: 1.3;
            text-overflow: ellipsis;
        }

        .pf-team-away {
            text-align: center;
        }

        .pf-vs {
            color: #5f7569;
            font-size: .65rem;
            font-weight: 800;
        }

        .pf-card-divider {
            height: 1px;
            background: var(--pf-border);
        }

        .pf-pick-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 0;
        }

        .pf-pick-label {
            display: block;
            margin-bottom: 3px;
            color: var(--pf-muted);
            font-size: .67rem;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .pf-pick-row strong {
            font-size: .86rem;
        }

        .pf-pick-selection {
            margin-left: 4px;
            color: var(--pf-green);
        }

        .pf-tier {
            flex-shrink: 0;
            padding: 5px 8px;
            border-radius: 7px;
            font-size: .66rem;
            font-weight: 800;
        }

        .pf-card-bottom {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            color: #71857a;
            font-size: .68rem;
        }


        /* =========================================================
           LOADING / ERROR / EMPTY
           ========================================================= */

        .pf-loading-card,
        .pf-empty-card,
        .pf-error-card {
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 24px;
            border:
                1px solid var(--pf-border);
            border-radius: 16px;
            background: rgba(255,255,255,.02);
            color: var(--pf-muted);
            text-align: center;
            font-size: .86rem;
        }

                .pf-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,.18);
            border-top-color: #6ee7a8;
            border-radius: 50%;
            animation: pf-spin .8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes pf-spin {
            to {
                transform: rotate(360deg);
            }
        }

        .pf-loading {
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: rgba(255,255,255,.68);
            font-size: 14px;
            text-align: center;
        }

        .pf-error,
        .pf-empty {
            min-height: 180px;
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: rgba(255,255,255,.68);
        }

        .pf-error strong,
        .pf-empty strong {
            display: block;
            margin-bottom: 8px;
            color: #fff;
            font-size: 16px;
        }

        .pf-error p,
        .pf-empty p {
            max-width: 560px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .pf-predictions-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .pf-prediction-card {
            position: relative;
            min-width: 0;
            padding: 22px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 18px;
            background:
                linear-gradient(
                    145deg,
                    rgba(16,185,129,.08),
                    rgba(7,20,15,.96)
                );
            box-shadow: 0 12px 30px rgba(0,0,0,.16);
            transition:
                border-color .2s ease,
                transform .2s ease,
                background .2s ease;
        }

        .pf-prediction-card:hover {
            transform: translateY(-3px);
            border-color: rgba(110,231,168,.28);
            background:
                linear-gradient(
                    145deg,
                    rgba(16,185,129,.12),
                    rgba(7,20,15,.98)
                );
        }

        .pf-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .pf-market {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,.06);
            color: rgba(255,255,255,.72);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .pf-confidence {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 64px;
            min-height: 28px;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
        }

        .pf-confidence.strong {
            background: rgba(34,197,94,.14);
            color: #6ee7a8;
        }

        .pf-confidence.good {
            background: rgba(190,242,100,.14);
            color: #d9f99d;
        }

        .pf-confidence.moderate {
            background: rgba(245,158,11,.14);
            color: #fbbf24;
        }

        .pf-confidence.weak {
            background: rgba(239,68,68,.14);
            color: #f87171;
        }

        .pf-mini-date {
            margin-bottom: 10px;
            color: rgba(255,255,255,.46);
            font-size: 11px;
            line-height: 1.5;
        }

        .pf-teams {
            display: grid;
            gap: 7px;
            margin-bottom: 20px;
        }

        .pf-team {
            color: #fff;
            font-size: 16px;
            font-weight: 750;
            line-height: 1.35;
        }

        .pf-team.away {
            color: rgba(255,255,255,.78);
        }

        .pf-vs {
            color: rgba(255,255,255,.34);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .pf-selection-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 14px 15px;
            border: 1px solid rgba(110,231,168,.12);
            border-radius: 13px;
            background: rgba(110,231,168,.045);
        }

        .pf-selection-label {
            min-width: 0;
            color: rgba(255,255,255,.48);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .pf-selection {
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            text-align: right;
        }

        .pf-probability {
            margin-top: 15px;
        }

        .pf-probability-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 7px;
        }

        .pf-probability-head span:first-child {
            color: rgba(255,255,255,.5);
            font-size: 11px;
        }

        .pf-probability-value {
            color: #6ee7a8;
            font-size: 14px;
            font-weight: 850;
        }

        .pf-progress {
            width: 100%;
            height: 5px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255,255,255,.07);
        }

        .pf-progress span {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: #6ee7a8;
        }

        .pf-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,.06);
        }

        .pf-league {
            min-width: 0;
            overflow: hidden;
            color: rgba(255,255,255,.42);
            font-size: 11px;
            line-height: 1.5;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pf-view-match {
            flex-shrink: 0;
            color: #6ee7a8;
            font-size: 11px;
            font-weight: 750;
            text-decoration: none;
        }

        .pf-view-match:hover {
            text-decoration: underline;
        }

        /* TOP PICKS */

        .pf-top-picks {
            display: grid;
            gap: 10px;
        }

        .pf-top-pick {
            display: grid;
            grid-template-columns: 42px minmax(0,1fr) auto;
            align-items: center;
            gap: 15px;
            padding: 15px 17px;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 15px;
            background: rgba(255,255,255,.025);
        }

        .pf-top-rank {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: rgba(110,231,168,.09);
            color: #6ee7a8;
            font-size: 12px;
            font-weight: 850;
        }

        .pf-top-match {
            min-width: 0;
        }

        .pf-top-teams {
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.45;
        }

        .pf-top-meta {
            margin-top: 4px;
            color: rgba(255,255,255,.42);
            font-size: 10px;
        }

        .pf-top-selection {
            text-align: right;
        }

        .pf-top-selection strong {
            display: block;
            color: #fff;
            font-size: 13px;
        }

        .pf-top-selection span {
            display: block;
            margin-top: 3px;
            color: #6ee7a8;
            font-size: 11px;
            font-weight: 800;
        }

        /* QUICK LINKS */

        .pf-quick-links {
            display: grid;
            grid-template-columns: repeat(3, minmax(0,1fr));
            gap: 14px;
        }

        .pf-quick-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            min-height: 72px;
            padding: 16px 18px;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 15px;
            background: rgba(255,255,255,.025);
            color: #fff;
            text-decoration: none;
            transition:
                background .2s ease,
                border-color .2s ease,
                transform .2s ease;
        }

        .pf-quick-link:hover {
            transform: translateY(-2px);
            border-color: rgba(110,231,168,.2);
            background: rgba(110,231,168,.045);
        }

        .pf-quick-link-content {
            min-width: 0;
        }

        .pf-quick-link-title {
            display: block;
            margin-bottom: 4px;
            color: #fff;
            font-size: 13px;
            font-weight: 750;
        }

        .pf-quick-link-text {
            display: block;
            color: rgba(255,255,255,.42);
            font-size: 10px;
            line-height: 1.5;
        }

        .pf-quick-arrow {
            flex-shrink: 0;
            color: #6ee7a8;
            font-size: 17px;
        }

        /* FOOTER */

        .site-footer {
            width: 100%;
            margin-top: 50px;
            padding: 34px 20px 24px;
            border-top: 1px solid rgba(255,255,255,.07);
            background: #06110c;
        }

        .pf-footer-inner {
            width: min(1120px, 100%);
            margin: 0 auto;
            padding: 0 18px;
            text-align: center;
        }

        .pf-footer-brand {
            margin: 0;
            color: rgba(255,255,255,.78);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .01em;
            text-align: center;
        }

        .pf-footer-tagline {
            margin: 7px auto 0;
            color: rgba(255,255,255,.4);
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
        }

        .pf-footer-links {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 18px;
            margin: 18px auto 0;
            padding: 0;
        }

        .pf-footer-links a {
            color: rgba(255,255,255,.54);
            font-size: 11px;
            font-weight: 650;
            text-decoration: none;
            white-space: nowrap;
        }

        .pf-footer-links a:hover {
            color: #6ee7a8;
        }

        .pf-footer-divider {
            width: 100%;
            max-width: 760px;
            height: 1px;
            margin: 20px auto;
            background: rgba(255,255,255,.06);
        }

        .pf-disclaimer {
            width: min(760px, 100%);
            margin: 0 auto;
            color: rgba(255,255,255,.36);
            font-size: 10px;
            line-height: 1.75;
            text-align: center;
        }

        .pf-copyright {
            margin: 15px 0 0;
            color: rgba(255,255,255,.28);
            font-size: 9px;
            line-height: 1.5;
            text-align: center;
        }

        .pf-designed {
            display: inline-block;
            margin-top: 8px;
            color: rgba(110,231,168,.58);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .05em;
            text-align: center;
            animation: pf-designed-pulse 2.4s ease-in-out infinite;
        }

        @keyframes pf-designed-pulse {
            0%,
            100% {
                opacity: .48;
                transform: translateY(0);
            }

            50% {
                opacity: 1;
                transform: translateY(-2px);
            }
        }

        /* MOBILE */

        @media (max-width: 900px) {

            .pf-predictions-grid {
                grid-template-columns: repeat(2, minmax(0,1fr));
            }

            .pf-quick-links {
                grid-template-columns: 1fr;
            }

            .pf-hero-title {
                font-size: clamp(34px, 7vw, 54px);
            }
        }

        @media (max-width: 700px) {

            .site-header {
                padding-left: 16px;
                padding-right: 16px;
            }

            .site-header-inner {
                padding-left: 4px;
                padding-right: 4px;
            }

            .pf-main {
                padding-left: 16px;
                padding-right: 16px;
            }

            .pf-hero {
                padding: 54px 18px 44px;
            }

            .pf-hero-title {
                max-width: 650px;
                margin-left: auto;
                margin-right: auto;
                font-size: clamp(31px, 9vw, 46px);
                line-height: 1.08;
            }

            .pf-hero-text {
                max-width: 600px;
                padding-left: 4px;
                padding-right: 4px;
            }

            .pf-stats {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .pf-stat {
                padding: 18px;
            }

            .pf-filter-grid {
                grid-template-columns: 1fr;
            }

            .pf-predictions-grid {
                grid-template-columns: 1fr;
            }

            .pf-top-pick {
                grid-template-columns: 36px minmax(0,1fr);
            }

            .pf-top-selection {
                grid-column: 2;
                text-align: left;
            }

            .pf-footer-inner {
                padding-left: 12px;
                padding-right: 12px;
            }

            .pf-footer-links {
                gap: 9px 16px;
            }
        }

        @media (max-width: 480px) {

            .pf-main {
                padding-left: 14px;
                padding-right: 14px;
            }

            .pf-section {
                margin-top: 42px;
            }

            .pf-section-heading {
                align-items: flex-start;
                gap: 12px;
            }

            .pf-section-heading h2 {
                font-size: 20px;
            }

            .pf-section-heading p {
                font-size: 11px;
            }

            .pf-filter-panel {
                padding: 14px;
            }

            .pf-prediction-card {
                padding: 18px;
                border-radius: 16px;
            }

            .pf-selection-box {
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
            }

            .pf-selection {
                text-align: left;
            }

            .pf-card-footer {
                align-items: flex-start;
                flex-direction: column;
            }

            .pf-view-match {
                align-self: flex-start;
            }

            .site-footer {
                padding-left: 14px;
                padding-right: 14px;
            }

            .pf-footer-links {
                gap: 8px 14px;
            }

            .pf-footer-links a {
                font-size: 10px;
            }

            .pf-disclaimer {
                padding: 0 4px;
                font-size: 9px;
                line-height: 1.7;
            }

            .pf-copyright,
            .pf-designed {
                font-size: 8px;
            }
        }
