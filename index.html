    <style>

        /* =========================================================
           PACEFETCH HOMEPAGE
           Scoped homepage redesign
        ========================================================= */

        :root {
            --pf-bg: #06140f;
            --pf-bg-soft: #091b14;
            --pf-panel: #0b2118;
            --pf-panel-2: #0e281e;
            --pf-border: rgba(255,255,255,.08);
            --pf-border-strong: rgba(255,255,255,.13);

            --pf-green: #20d889;
            --pf-green-2: #15b970;
            --pf-green-soft: rgba(32,216,137,.12);

            --pf-text: #f4faf7;
            --pf-text-2: #c2d1ca;
            --pf-text-3: #82968d;

            --pf-yellow: #d8ee62;
            --pf-amber: #f0ad3d;
            --pf-red: #ef6565;

            --pf-radius-sm: 10px;
            --pf-radius-md: 16px;
            --pf-radius-lg: 22px;

            --pf-container: 1180px;
        }

        .pf-home {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(32,216,137,.10),
                    transparent 35%
                ),
                var(--pf-bg);
            color: var(--pf-text);
        }

        .pf-container {
            width: min(
                calc(100% - 40px),
                var(--pf-container)
            );
            margin: 0 auto;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .pf-header {
            position: sticky;
            top: 0;
            z-index: 1000;

            border-bottom: 1px solid var(--pf-border);

            background:
                rgba(6,20,15,.90);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .pf-header-inner {
            min-height: 74px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 24px;
        }

        .pf-brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;

            color: var(--pf-text);
            text-decoration: none;

            min-width: 0;
        }

        .pf-brand-logo {
            width: 40px;
            height: 40px;

            flex: 0 0 40px;

            display: block;
            object-fit: contain;
        }

        .pf-brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.5px;
        }

        .pf-brand-name span {
            color: var(--pf-green);
        }

        .pf-nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pf-nav a {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 42px;
            padding: 0 14px;

            border-radius: 10px;

            color: var(--pf-text-2);
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition:
                background .2s ease,
                color .2s ease;
        }

        .pf-nav a:hover,
        .pf-nav a.active {
            color: var(--pf-text);
            background: rgba(255,255,255,.06);
        }

        .pf-nav a.active {
            color: var(--pf-green);
        }

        .pf-mobile-menu {
            width: 42px;
            height: 42px;

            display: none;

            align-items: center;
            justify-content: center;

            border: 1px solid var(--pf-border);
            border-radius: 10px;

            background: rgba(255,255,255,.04);
            color: var(--pf-text);

            cursor: pointer;
        }

        .pf-mobile-menu svg {
            width: 21px;
            height: 21px;
        }

        /* =========================================================
           HERO
        ========================================================= */

        .pf-hero {
            padding:
                76px
                0
                58px;
        }

        .pf-hero-grid {
            display: grid;
            grid-template-columns:
                minmax(0, 1.35fr)
                minmax(300px, .65fr);

            gap: 60px;
            align-items: center;
        }

        .pf-live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 8px 11px;

            border: 1px solid rgba(32,216,137,.22);
            border-radius: 999px;

            background: rgba(32,216,137,.08);

            color: var(--pf-green);

            font-size: 11px;
            font-weight: 800;
            letter-spacing: .8px;
            text-transform: uppercase;
        }

        .pf-live-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;
            background: var(--pf-green);

            box-shadow:
                0 0 0 4px
                rgba(32,216,137,.10);
        }

        .pf-hero h1 {
            max-width: 760px;

            margin:
                22px
                0
                18px;

            font-size:
                clamp(
                    40px,
                    6vw,
                    70px
                );

            line-height: 1.03;
            letter-spacing: -2.8px;

            font-weight: 850;
        }

        .pf-hero h1 span {
            color: var(--pf-green);
        }

        .pf-hero-text {
            max-width: 690px;

            margin: 0;

            color: var(--pf-text-2);

            font-size: 17px;
            line-height: 1.75;
        }

        .pf-hero-actions {
            display: flex;
            flex-wrap: wrap;

            gap: 12px;

            margin-top: 30px;
        }

        .pf-button {
            min-height: 48px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            padding: 0 19px;

            border-radius: 11px;

            font-size: 14px;
            font-weight: 750;

            text-decoration: none;

            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease;
        }

        .pf-button:hover {
            transform: translateY(-1px);
        }

        .pf-button svg {
            width: 17px;
            height: 17px;
        }

        .pf-button-primary {
            border: 1px solid
                rgba(32,216,137,.35);

            background: var(--pf-green);
            color: #04150d;
        }

        .pf-button-primary:hover {
            background: #35e398;
        }

        .pf-button-secondary {
            border: 1px solid var(--pf-border-strong);
            background: rgba(255,255,255,.035);
            color: var(--pf-text);
        }

        .pf-button-secondary:hover {
            background: rgba(255,255,255,.07);
        }

        /* =========================================================
           HERO VISUAL
        ========================================================= */

        .pf-hero-card {
            position: relative;

            padding: 22px;

            border: 1px solid var(--pf-border);
            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(17,48,35,.95),
                    rgba(7,24,17,.96)
                );

            box-shadow:
                0 25px 70px
                rgba(0,0,0,.24);
        }

        .pf-hero-card::before {
            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            top: -60px;
            right: -50px;

            border-radius: 50%;

            background:
                rgba(32,216,137,.10);

            filter: blur(8px);

            pointer-events: none;
        }

        .pf-mini-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 18px;
        }

        .pf-mini-title {
            font-size: 13px;
            font-weight: 800;
        }

        .pf-mini-date {
            color: var(--pf-text-3);
            font-size: 11px;
        }

        .pf-demo-match {
            padding: 18px;

            border:
                1px solid
                rgba(255,255,255,.07);

            border-radius: 16px;

            background:
                rgba(255,255,255,.025);
        }

        .pf-demo-teams {
            display: grid;
            grid-template-columns: 1fr auto 1fr;

            gap: 12px;
            align-items: center;
        }

        .pf-demo-team {
            text-align: center;
        }

        .pf-team-circle {
            width: 44px;
            height: 44px;

            margin: 0 auto 9px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                rgba(32,216,137,.09);

            border:
                1px solid
                rgba(32,216,137,.16);

            color: var(--pf-green);

            font-weight: 900;
            font-size: 13px;
        }

        .pf-demo-team strong {
            display: block;

            font-size: 12px;
            line-height: 1.35;
        }

        .pf-vs {
            color: var(--pf-text-3);
            font-size: 11px;
            font-weight: 800;
        }

        .pf-demo-probability {
            margin-top: 19px;
        }

        .pf-prob-label {
            display: flex;
            justify-content: space-between;
            gap: 10px;

            margin-bottom: 8px;

            color: var(--pf-text-2);

            font-size: 11px;
            font-weight: 650;
        }

        .pf-prob-value {
            color: var(--pf-green);
            font-weight: 850;
        }

        .pf-prob-track {
            height: 7px;

            overflow: hidden;

            border-radius: 999px;

            background:
                rgba(255,255,255,.07);
        }

        .pf-prob-fill {
            width: 84%;

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    var(--pf-green-2),
                    var(--pf-green)
                );
        }

        /* =========================================================
           SECTION
        ========================================================= */

        .pf-section {
            padding: 28px 0 70px;
        }

        .pf-section-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 22px;
        }

        .pf-section-heading h2 {
            margin: 0;

            font-size: 26px;
            line-height: 1.2;

            letter-spacing: -.8px;
        }

        .pf-section-heading p {
            margin: 7px 0 0;

            color: var(--pf-text-3);

            font-size: 13px;
            line-height: 1.6;
        }

        .pf-section-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            white-space: nowrap;

            color: var(--pf-green);
            text-decoration: none;

            font-size: 13px;
            font-weight: 750;
        }

        .pf-section-link svg {
            width: 15px;
            height: 15px;
        }

        /* =========================================================
           STATS
        ========================================================= */

        .pf-stats {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0,1fr));

            gap: 14px;

            margin-top: 10px;
        }

        .pf-stat {
            min-width: 0;

            padding: 20px;

            border:
                1px solid
                var(--pf-border);

            border-radius: var(--pf-radius-md);

            background:
                rgba(255,255,255,.025);
        }

        .pf-stat-label {
            display: flex;
            align-items: center;
            gap: 8px;

            color: var(--pf-text-3);

            font-size: 12px;
            font-weight: 650;
        }

        .pf-stat-icon {
            width: 29px;
            height: 29px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 8px;

            background: var(--pf-green-soft);
            color: var(--pf-green);
        }

        .pf-stat-icon svg {
            width: 15px;
            height: 15px;
        }

        .pf-stat-value {
            margin-top: 14px;

            font-size: 30px;
            line-height: 1;

            font-weight: 850;
            letter-spacing: -1px;
        }

        .pf-stat-value.green {
            color: var(--pf-green);
        }

        /* =========================================================
           FILTERS
        ========================================================= */

        .pf-filter-panel {
            padding: 18px;

            border:
                1px solid
                var(--pf-border);

            border-radius: var(--pf-radius-md);

            background:
                rgba(255,255,255,.025);

            margin-bottom: 22px;
        }

        .pf-filter-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 14px;

            margin-bottom: 14px;
        }

        .pf-filter-title {
            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 13px;
            font-weight: 800;
        }

        .pf-filter-title svg {
            width: 17px;
            height: 17px;

            color: var(--pf-green);
        }

        .pf-filter-clear {
            border: 0;
            background: none;

            color: var(--pf-text-3);

            cursor: pointer;

            font-size: 12px;
            font-weight: 650;
        }

        .pf-filter-clear:hover {
            color: var(--pf-green);
        }

        .pf-filter-grid {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0,1fr));

            gap: 12px;
        }

        .pf-field {
            position: relative;
        }

        .pf-field label {
            display: block;

            margin:
                0
                0
                7px
                2px;

            color: var(--pf-text-3);

            font-size: 11px;
            font-weight: 700;
        }

        .pf-select-wrap {
            position: relative;
        }

        .pf-select {
            width: 100%;
            height: 45px;

            appearance: none;
            -webkit-appearance: none;

            padding:
                0
                43px
                0
                13px;

            border:
                1px solid
                var(--pf-border);

            border-radius: 10px;

            outline: none;

            background:
                rgba(0,0,0,.18);

            color: var(--pf-text);

            font-family: inherit;
            font-size: 12px;
            font-weight: 600;

            cursor: pointer;
        }

        .pf-select:focus {
            border-color:
                rgba(32,216,137,.45);

            box-shadow:
                0 0 0 3px
                rgba(32,216,137,.07);
        }

        .pf-select option {
            background: #0b2118;
            color: white;
        }

        .pf-chevron {
            position: absolute;

            top: 50%;
            right: 14px;

            width: 16px;
            height: 16px;

            transform:
                translateY(-50%);

            pointer-events: none;

            color: var(--pf-text-3);
        }

        /* =========================================================
           SEARCH
        ========================================================= */

        .pf-search {
            position: relative;

            margin-bottom: 14px;
        }

        .pf-search-icon {
            position: absolute;

            top: 50%;
            left: 14px;

            width: 17px;
            height: 17px;

            transform:
                translateY(-50%);

            color: var(--pf-text-3);

            pointer-events: none;
        }

        .pf-search-input {
            width: 100%;
            height: 45px;

            padding:
                0
                14px
                0
                42px;

            border:
                1px solid
                var(--pf-border);

            border-radius: 10px;

            outline: none;

            background:
                rgba(0,0,0,.18);

            color: var(--pf-text);

            font-family: inherit;
            font-size: 13px;
        }

        .pf-search-input::placeholder {
            color: var(--pf-text-3);
        }

        .pf-search-input:focus {
            border-color:
                rgba(32,216,137,.45);

            box-shadow:
                0 0 0 3px
                rgba(32,216,137,.07);
        }

        /* =========================================================
           PREDICTIONS
        ========================================================= */

        .pf-predictions-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0,1fr));

            gap: 15px;
        }

        .pf-prediction-card {
            min-width: 0;

            padding: 18px;

            border:
                1px solid
                var(--pf-border);

            border-radius: var(--pf-radius-md);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.035),
                    rgba(255,255,255,.015)
