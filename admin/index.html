<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PaceFetch Admin Dashboard</title>

<meta name="robots" content="noindex,nofollow">

<meta name="theme-color" content="#06101c">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050d17;
    --panel:#0a1726;
    --panel2:#0d1c2e;
    --border:rgba(255,255,255,.08);
    --text:#f5f8fc;
    --muted:#778ba1;
    --green:#28d783;
    --green2:#13ae67;
    --red:#ff6464;
    --yellow:#f5c451;
    --blue:#5ca9ff;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    min-height:100vh;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

/* =====================================================
   LOGIN
===================================================== */

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(
            circle at top,
            rgba(40,215,131,.09),
            transparent 35%
        ),
        var(--bg);
}

.login-box{
    width:100%;
    max-width:420px;
    padding:30px;
    border:1px solid var(--border);
    border-radius:26px;
    background:rgba(10,23,38,.92);
    box-shadow:0 30px 100px rgba(0,0,0,.35);
}

.logo{
    width:58px;
    height:58px;
    border-radius:17px;
    display:grid;
    place-items:center;
    background:linear-gradient(
        135deg,
        var(--green),
        var(--green2)
    );
    color:#03130c;
    font-size:28px;
    font-weight:1000;
    margin-bottom:20px;
}

.login-box h1{
    font-size:29px;
}

.login-box p{
    color:var(--muted);
    margin-top:7px;
    font-size:13px;
}

.password-wrap{
    position:relative;
    margin-top:24px;
}

.password-wrap input{
    width:100%;
    padding:14px 48px 14px 14px;
}

.password-toggle{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:var(--muted);
    padding:8px;
}

.login-button{
    width:100%;
    margin-top:13px;
    padding:14px;
    border:0;
    border-radius:13px;
    background:var(--green);
    color:#03130c;
    font-weight:900;
}

.login-error{
    min-height:20px;
    margin-top:10px;
    color:var(--red);
    font-size:12px;
}

/* =====================================================
   APP
===================================================== */

.admin-app{
    display:none;
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:250px;
    background:#071321;
    border-right:1px solid var(--border);
    z-index:200;
    display:flex;
    flex-direction:column;
}

.sidebar-logo{
    padding:22px;
    display:flex;
    align-items:center;
    gap:11px;
    border-bottom:1px solid var(--border);
}

.sidebar-logo-mark{
    width:39px;
    height:39px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:var(--green);
    color:#03130c;
    font-weight:1000;
}

.sidebar-logo strong{
    font-size:17px;
}

.sidebar-logo small{
    display:block;
    color:var(--muted);
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1.2px;
}

.sidebar-nav{
    padding:15px 11px;
    overflow-y:auto;
}

.nav-section{
    margin:15px 10px 7px;
    color:#4f6379;
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1.5px;
}

.nav-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 12px;
    border:0;
    background:transparent;
    color:#8194a9;
    border-radius:11px;
    text-align:left;
    font-size:12px;
    font-weight:800;
    margin-bottom:3px;
}

.nav-item:hover,
.nav-item.active{
    color:#fff;
    background:rgba(40,215,131,.08);
}

.nav-icon{
    width:22px;
    text-align:center;
    font-size:15px;
}

.sidebar-bottom{
    margin-top:auto;
    padding:14px;
    border-top:1px solid var(--border);
}

.sidebar-bottom button{
    width:100%;
    border:0;
    background:transparent;
    color:#7e91a6;
    padding:10px;
    text-align:left;
    font-size:12px;
    font-weight:800;
}

/* =====================================================
   MAIN
===================================================== */

.main{
    margin-left:250px;
    min-height:100vh;
}

.topbar{
    height:72px;
    padding:0 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
    background:rgba(5,13,23,.9);
    backdrop-filter:blur(18px);
    position:sticky;
    top:0;
    z-index:100;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:13px;
}

.page-title{
    font-size:18px;
    font-weight:900;
}

.page-subtitle{
    color:var(--muted);
    font-size:10px;
}

.top-actions{
    display:flex;
    gap:7px;
}

.icon-button{
    width:39px;
    height:39px;
    border:1px solid var(--border);
    background:#0b1929;
    color:#a9bacb;
    border-radius:11px;
    display:grid;
    place-items:center;
    font-size:17px;
}

.icon-button:hover{
    color:#fff;
    border-color:rgba(40,215,131,.3);
}

.content{
    padding:25px;
    max-width:1500px;
    margin:auto;
}

/* =====================================================
   PANELS
===================================================== */

.page{
    display:none;
}

.page.active{
    display:block;
}

.cards{
    display:grid;
    grid-template-columns:
        repeat(4,minmax(0,1fr));
    gap:13px;
}

.stat-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
}

.stat-label{
    color:var(--muted);
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
}

.stat-value{
    font-size:31px;
    font-weight:1000;
    margin-top:8px;
}

.stat-note{
    color:#52677e;
    font-size:10px;
    margin-top:4px;
}

.section{
    margin-top:18px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
}

.section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:17px;
}

.section-header h2{
    font-size:16px;
}

.section-header p{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

/* =====================================================
   BUTTONS
===================================================== */

.btn{
    border:0;
    border-radius:10px;
    padding:10px 14px;
    font-size:11px;
    font-weight:900;
}

.btn-primary{
    background:var(--green);
    color:#03130c;
}

.btn-secondary{
    background:#122337;
    color:#b4c2d0;
    border:1px solid var(--border);
}

.btn-danger{
    background:rgba(255,100,100,.1);
    color:#ff7777;
}

.btn-warning{
    background:rgba(245,196,81,.1);
    color:#f5c451;
}

/* =====================================================
   TABLE
===================================================== */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th{
    text-align:left;
    color:#60758c;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1px;
    padding:10px;
    border-bottom:1px solid var(--border);
}

td{
    padding:12px 10px;
    border-bottom:1px solid rgba(255,255,255,.045);
    color:#a9b8c8;
    font-size:11px;
}

td strong{
    color:#f4f7fa;
}

.row-actions{
    display:flex;
    gap:5px;
}

.mini-btn{
    border:1px solid var(--border);
    background:#101f31;
    color:#aab9c8;
    border-radius:7px;
    padding:6px 8px;
    font-size:10px;
}

.mini-btn.delete{
    color:#ff7777;
}

/* =====================================================
   FORMS
===================================================== */

.form-grid{
    display:grid;
    grid-template-columns:
        repeat(2,minmax(0,1fr));
    gap:13px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    color:#8093a8;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
}

input,
textarea,
select{
    width:100%;
    border:1px solid var(--border);
    background:#081523;
    color:#eef4f9;
    border-radius:10px;
    padding
