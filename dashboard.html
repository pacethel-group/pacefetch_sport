<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PaceFetch — Dashboard</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/css/style.css">
<style>
body{min-height:100vh}
.dashboard-wrap{width:min(760px,calc(100% - 24px));margin:40px auto}
.dashboard-card{background:#09150e;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px}
.dashboard-title{margin:0 0 6px;font-size:25px}
.dashboard-subtitle{margin:0 0 22px;color:#7f8e85;font-size:13px}
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:7px;color:#aab7b0;font-size:12px;font-weight:700}
.field input{width:100%;height:44px;padding:0 12px;border:1px solid rgba(255,255,255,.1);border-radius:9px;background:#06100b;color:#fff;outline:none}
.dashboard-button{width:100%;height:44px;border:0;border-radius:9px;background:#1bc472;color:#041008;font-weight:800;cursor:pointer}
.dashboard-button:disabled{opacity:.6}
.status{margin-top:13px;min-height:20px;color:#ef8b8b;font-size:12px}
#dashboardContent{display:none}
.stat{padding:15px;border:1px solid rgba(255,255,255,.07);border-radius:11px;background:#06100b;margin-top:10px}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner">
<a class="brand" href="/index.html" aria-label="PaceFetch home"><span class="brand-pace">Pace</span><span class="brand-fetch">Fetch</span></a>
</div></header>
<main class="dashboard-wrap">
<section id="loginCard" class="dashboard-card">
<h1 class="dashboard-title">PaceFetch Dashboard</h1>
<p class="dashboard-subtitle">Secure administrator access.</p>
<form id="loginForm">
<div class="field"><label for="password">Dashboard password</label><input id="password" type="password" autocomplete="current-password" required></div>
<button id="loginButton" class="dashboard-button" type="submit">Sign in</button>
<div id="loginStatus" class="status" role="alert"></div>
</form>
</section>
<section id="dashboardContent" class="dashboard-card">
<h1 class="dashboard-title">Dashboard</h1>
<p class="dashboard-subtitle">Authenticated PaceFetch administration area.</p>
<div class="stat"><strong>Prediction API</strong><br><span id="apiStatus">Checking…</span></div>
<div class="stat"><strong>Today</strong><br><span id="todayStatus">Checking…</span></div>
<button id="logoutButton" class="dashboard-button" style="margin-top:15px">Log out</button>
</section>
</main>
<script>
const form=document.getElementById("loginForm"),btn=document.getElementById("loginButton"),status=document.getElementById("loginStatus");
form.addEventListener("submit",async e=>{
e.preventDefault();status.textContent="";btn.disabled=true;
try{
const r=await fetch("/api/dashboard-auth",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({password:document.getElementById("password").value})});
const d=await r.json().catch(()=>({}));
if(!r.ok||!d.success){status.textContent=d.error||"Authentication failed.";return;}
document.getElementById("loginCard").style.display="none";document.getElementById("dashboardContent").style.display="block";
try{const p=await fetch("/api/predictions",{credentials:"include"}),x=await p.json();document.getElementById("apiStatus").textContent=p.ok&&x.success?"Online":"Unavailable";document.getElementById("todayStatus").textContent=(x.predictions?.length??0)+" published prediction(s)";}catch(_){document.getElementById("apiStatus").textContent="Unavailable";document.getElementById("todayStatus").textContent="Could not contact prediction API."}
}finally{btn.disabled=false;}
});
document.getElementById("logoutButton").onclick=async()=>{await fetch("/api/dashboard-auth",{method:"DELETE",credentials:"include"}).catch(()=>{});location.reload();};
</script>
</body>
</html>
