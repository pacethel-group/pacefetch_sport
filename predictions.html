<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        PaceFetch Predictions — Today's Football Predictions
    </title>

    <meta
        name="description"
        content="PaceFetch football predictions with data-driven probabilities, confidence rankings, today's matches and top picks."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="canonical"
        href="https://pacefetchsport.vercel.app/predictions.html"
    >

    <style>

        :root {
            --bg: #06130c;
            --bg-soft: #0a1c12;
            --card: #0d2116;
            --card-soft: #10291a;
            --border: rgba(91, 166, 118, 0.22);
            --text: #eef8f1;
            --muted: #9eb5a5;
            --green: #39c46a;
            --green-bright: #54dc7d;
            --white: #ffffff;
            --strong: #31d36a;
            --good: #c9e95a;
            --moderate: #e7a83c;
            --weak: #ef5555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(34, 105, 57, 0.16),
                    transparent 35%
                ),
                var(--bg);
            color: var(--text);
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            line-height: 1.5;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .hidden {
            display: none !important;
        }

        /* HEADER */

        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            background: rgba(6, 19, 12, 0.96);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(14px);
        }

        .header-inner {
            width: calc(100% - 24px);
            max-width: 1180px;
            margin: 0 auto;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            font-size: 23px;
            font-weight: 900;
            letter-spacing: -1px;
            white-space: nowrap;
        }

        .brand-pace {
            color: var(--white);
        }

        .brand-fetch {
            color: var(--green);
        }

        .desktop-nav {
            display: flex;
            align-items: center;
            gap: 22px;
            font-size: 14px;
            color: var(--muted);
        }

        .desktop-nav a {
            transition: color 0.2s ease;
        }

        .desktop-nav a:hover {
            color: var(--green-bright);
        }

        .mobile-menu {
            display: none;
            color: var(--muted);
            font-size: 12px;
        }

        /* HERO */

        .hero {
            width: calc(100% - 24px);
            max-width: 1180px;
            margin: 0 auto;
            padding: 42px 0 28px;
        }

        .hero-label {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 5px 10px;
            border-radius: 999px;
            border: 1px solid rgba(57, 196, 106, 0.28);
            background: rgba(57, 196, 106, 0.08);
            color: var(--green-bright);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .hero h1 {
            margin-top: 14px;
            max-width: 760px;
            font-size: clamp(30px, 5vw, 52px);
            line-height: 1.04;
            letter-spacing: -2px;
        }

        .hero h1 span {
            color: var(--green);
        }

        .hero p {
            max-width: 680px;
            margin-top: 14px;
            color: var(--muted);
            font-size: 15px;
        }

        /* STATS */

        .stats {
            width: calc(100% - 24px);
            max-width: 1180px;
            margin: 0 auto 28px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .stat {
            min-height: 86px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
        }

        .stat strong {
            display: block;
            font-size: 25px;
            line-height: 1.1;
            color: var(--white);
        }

        .stat span {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        /* MAIN */

        .main-content {
            width: calc(100% - 24px);
            max-width: 1180px;
            margin: 0 auto;
        }

        .section-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 14px;
        }

        .section-heading h2 {
            font-size: 23px;
            line-height: 1.1;
        }

        .section-heading p {
            color: var(--muted);
            font-size: 12px;
        }

        /* SEARCH */

        .search-wrap {
            width: calc(100% - 12px);
            margin: 0 auto 10px;
        }

        .search-input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--card);
            color: var(--text);
            outline: none;
            font-size: 14px;
        }

        .search-input::placeholder {
            color: #71877a;
        }

        .search-input:focus {
            border-color: var(--green);
            box-shadow:
                0 0 0 2px rgba(57, 196, 106, 0.1);
        }

        /* FILTERS */

        .filters {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 10px;
            width: calc(100% - 12px);
            margin: 0 auto 18px;
        }

        /*
         * Clean filter controls.
         *
         * Native browser arrows are deliberately removed.
         * No replacement arrow is added.
         */

        .filter-control {
            width: 100%;
            min-width: 0;
            height: 44px;
            padding: 0 12px;
            border: 1px solid rgba(91, 166, 118, 0.28);
            border-radius: 8px;
            background: #10251a;
            color: #dcefe3;
            font-size: 13px;
            outline: none;

            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;

            background-image: none;
        }

        .filter-control:focus {
            border-color: var(--green);
            box-shadow:
                0 0 0 2px rgba(57, 196, 106, 0.12);
        }

        .filter-control option {
            background: #10251a;
            color: #dcefe3;
        }

        /* DATE */

        .date-row {
            width: calc(100% - 12px);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .date-label {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .date-input {
            height: 40px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            outline: none;
        }

        .date-input:focus {
            border-color: var(--green);
        }

        /* PREDICTION GRID */

        .prediction-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .prediction-card {
            position: relative;
            overflow: hidden;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background:
                linear-gradient(
                    145deg,
                    rgba(16, 41, 26, 0.98),
                    rgba(9, 28, 17, 0.98)
                );
            transition:
                transform 0.2s ease,
                border-color 0.2s ease;
        }

        .prediction-card:hover {
            transform: translateY(-2px);
            border-color:
                rgba(57, 196, 106, 0.42);
        }

        .prediction-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .prediction-rank {
            color: #789283;
            font-size: 11px;
            font-weight: 800;
        }

        .confidence-badge {
            display: inline-flex;
            align-items: center;
            min-height: 25px;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 900;
            white-space: nowrap;
        }

        .confidence-badge.strong {
            background:
                rgba(49, 211, 106, 0.14);
            color: var(--strong);
        }

        .confidence-badge.good {
            background:
                rgba(201, 233, 90, 0.13);
            color: var(--good);
        }

        .confidence-badge.moderate {
            background:
                rgba(231, 168, 60, 0.13);
            color: var(--moderate);
        }

        .confidence-badge.weak {
            background:
                rgba(239, 85, 85, 0.13);
            color: var(--weak);
        }

        .competition {
            margin-top: 12px;
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .competition span {
            margin: 0 4px;
            color: #50685a;
        }

        .teams {
            display: grid;
            grid-template-columns:
                minmax(0, 1fr)
                auto
                minmax(0, 1fr);
            align-items: center;
            gap: 9px;
            margin-top: 13px;
        }

        .team {
            min-width: 0;
            color: var(--white);
            font-size: 14px;
            font-weight: 800;
            line-height: 1.25;
        }

        .team.home {
            text-align: left;
        }

        .team.away {
            text-align: right;
        }

        .vs {
            color: #5f7869;
            font-size: 9px;
            font-weight: 900;
        }

        .kickoff {
            margin-top: 9px;
            color: #789283;
            font-size: 10px;
        }

        .prediction-result {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
            padding: 11px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.18);
        }

        .prediction-result > div:first-child {
            min-width: 0;
        }

        .result-label {
            display: block;
            color: #71877a;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .prediction-result strong {
            display: block;
            margin-top: 2px;
            color: var(--white);
            font-size: 14px;
        }

        .probability {
            color: var(--green-bright);
            font-size: 19px;
            font-weight: 900;
            white-space: nowrap;
        }

        .probability-bar {
            width: 100%;
            height: 4px;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 999px;
            background: #173121;
        }

        .probability-bar span {
            display: block;
            height: 100%;
            border-radius: inherit;
        }

        .probability-bar span.strong {
            background: var(--strong);
        }

        .probability-bar span.good {
            background: var(--good);
        }

        .probability-bar span.moderate {
            background: var(--moderate);
        }

        .probability-bar span.weak {
            background: var(--weak);
        }

        .prediction-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 12px;
            color: #617869;
            font-size: 9px;
        }

        .prediction-footer a {
            color: var(--green-bright);
            font-weight: 800;
        }

        /* STATES */

        .state-box {
            width: calc(100% - 12px);
            margin: 15px auto;
            padding: 35px 18px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
        }

        .state-box h3 {
            margin-bottom: 6px;
            font-size: 18px;
        }

        .state-box p {
            max-width: 480px;
            margin: 0 auto;
            color: var(--muted);
            font-size: 13px;
        }

        .state-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background:
                rgba(57, 196, 106, 0.1);
            color: var(--green);
            font-weight: 900;
        }

        .retry-button {
            margin-top: 15px;
            padding: 9px 15px;
            border: 0;
            border-radius: 7px;
            background: var(--green);
            color: #041009;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
        }

        .retry-button:hover {
            background: var(--green-bright);
        }

        /* AD */

        .ad-section {
            width: calc(100% - 12px);
            margin: 30px auto;
            padding: 10px;
            border: 1px solid rgba(91, 166, 118, 0.12);
            border-radius: 9px;
            background:
                rgba(7, 22, 13, 0.65);
        }

        .ad-label {
            margin-bottom: 7px;
            color: #53685a;
            font-size: 8px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ad-container {
            width: 100%;
            min-height: 90px;
        }

        /* QUICK LINKS */

        .quick-links {
            width: calc(100% - 12px);
            margin: 25px auto 35px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-links a {
            padding: 8px 11px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--card);
            color: var(--muted);
            font-size: 11px;
        }

        .quick-links a:hover {
            color: var(--green-bright);
            border-color:
                rgba(57, 196, 106, 0.4);
        }

        /* FOOTER */

        .site-footer {
            margin-top: 45px;
            padding: 30px 12px;
            border-top: 1px solid var(--border);
            background: #040d08;
            text-align: center;
        }

        .footer-brand {
            font-size: 21px;
            font-weight: 900;
        }

        .site-footer > p {
            max-width: 600px;
            margin: 7px auto 0;
            color: var(--muted);
            font-size: 11px;
        }

        .site-footer .disclaimer {
            margin-top: 10px;
            color: #687c6e;
        }

        .footer-links {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 13px;
            margin-top: 16px;
        }

        .footer-links a {
            color: #7f9587;
            font-size: 10px;
        }

        .footer-links a:hover {
            color: var(--green);
        }

        .copyright {
            margin-top: 15px !important;
        }

        .designed {
            margin-top: 4px !important;
        }

        .designed strong {
            color: var(--green);
        }

        /* TABLET */

        @media (max-width: 900px) {

            .prediction-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .filters {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }

        /* MOBILE */

        @media (max-width: 760px) {

            .desktop-nav {
                display: none;
            }

            .mobile-menu {
                display: block;
            }

            .hero {
                padding-top: 30px;
            }

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .filters {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
                gap: 8px;
                width: calc(100% - 12px);
            }

            .filter-control {
                height: 42px;
                padding: 0 10px;
                font-size: 12px;
            }

            .prediction-grid {
                grid-template-columns: 1fr;
            }

        }

        /* SMALL MOBILE */

        @media (max-width: 420px) {

            .header-inner {
                width: calc(100% - 14px);
            }

            .hero,
            .stats,
            .main-content {
                width: calc(100% - 14px);
            }

            .hero h1 {
                font-size: 31px;
                letter-spacing: -1.4px;
            }

            .hero p {
                font-size: 13px;
            }

            .stats {
                gap: 7px;
            }

            .stat {
                min-height: 78px;
                padding: 12px;
            }

            .stat strong {
                font-size: 21px;
            }

            .filters {
                width: calc(100% - 8px);
                gap: 7px;
            }

            .filter-control {
                padding: 0 9px;
                font-size: 11.5px;
            }

            .search-wrap,
            .date-row,
            .state-box,
            .ad-section,
            .quick-links {
                width: calc(100% - 8px);
            }

            .section-heading {
                align-items: flex-start;
                flex-direction: column;
                gap: 4px;
            }

            .prediction-card {
                padding: 13px;
                border
