<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Football Countries & Leagues | PaceFetch
    </title>

    <meta
        name="description"
        content="Browse football countries and leagues on PaceFetch. Explore available matches, predictions and football markets by country."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="canonical"
        href="https://pacefetch.com/countries.html"
    >

    <link
        rel="icon"
        href="/assets/logo.svg"
        type="image/svg+xml"
    >

    <style>

        :root {

            --bg:
                #07110d;

            --bg-soft:
                #0b1812;

            --card:
                #0e1f16;

            --card-hover:
                #13291e;

            --border:
                rgba(255,255,255,0.08);

            --text:
                #f1f7f3;

            --muted:
                #91a59a;

            --green:
                #27d17f;

            --green-dark:
                #15945a;

            --lime:
                #b7f36b;

            --danger:
                #ff6464;

            --shadow:
                0 15px 45px rgba(0,0,0,0.22);

        }


        * {

            box-sizing:
                border-box;

            margin:
                0;

            padding:
                0;

        }


        html {

            scroll-behavior:
                smooth;

        }


        body {

            min-height:
                100vh;

            background:
                var(--bg);

            color:
                var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            line-height:
                1.6;

        }


        a {

            color:
                inherit;

            text-decoration:
                none;

        }


        button,
        select {

            font:
                inherit;

        }


        .container {

            width:
                min(1180px, 92%);

            margin:
                0 auto;

        }


        /* --------------------------------------------------------------
           Header
        -------------------------------------------------------------- */

        header {

            position:
                sticky;

            top:
                0;

            z-index:
                1000;

            background:
                rgba(7,17,13,0.94);

            backdrop-filter:
                blur(14px);

            border-bottom:
                1px solid
                var(--border);

        }


        .header-inner {

            min-height:
                70px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;

        }


        .brand {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            font-size:
                22px;

            font-weight:
                800;

            letter-spacing:
                -0.5px;

        }


        .brand img {

            width:
                36px;

            height:
                36px;

            object-fit:
                contain;

        }


        .desktop-nav {

            display:
                flex;

            align-items:
                center;

            gap:
                24px;

        }


        .desktop-nav a {

            color:
                var(--muted);

            font-size:
                14px;

            font-weight:
                600;

            transition:
                color .2s ease;

        }


        .desktop-nav a:hover {

            color:
                var(--green);

        }


        .mobile-toggle {

            width:
                42px;

            height:
                42px;

            display:
                none;

            align-items:
                center;

            justify-content:
                center;

            flex-direction:
                column;

            gap:
                5px;

            background:
                transparent;

            border:
                1px solid
                var(--border);

            border-radius:
                10px;

            cursor:
                pointer;

        }


        .mobile-toggle span {

            width:
                18px;

            height:
                2px;

            background:
                var(--text);

            border-radius:
                10px;

        }


        .mobile-menu {

            display:
                none;

            border-top:
                1px solid
                var(--border);

            background:
                var(--bg-soft);

        }


        .mobile-menu a {

            display:
                block;

            padding:
                14px 4%;

            border-bottom:
                1px solid
                var(--border);

            color:
                var(--muted);

        }


        .mobile-menu a:hover {

            color:
                var(--green);

        }


        .mobile-menu.open {

            display:
                block;

        }


        /* --------------------------------------------------------------
           Page
        -------------------------------------------------------------- */

        .page {

            padding:
                42px 0 70px;

        }


        .breadcrumb {

            display:
                flex;

            flex-wrap:
                wrap;

            align-items:
                center;

            gap:
                8px;

            margin-bottom:
                26px;

            color:
                var(--muted);

            font-size:
                13px;

        }


        .breadcrumb a {

            color:
                var(--green);

        }


        .hero {

            padding:
                34px;

            border:
                1px solid
                var(--border);

            border-radius:
                22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(39,209,127,0.12),
                    rgba(14,31,22,0.96)
                );

            box-shadow:
                var(--shadow);

            margin-bottom:
                28px;

        }


        .eyebrow {

            color:
                var(--green);

            font-size:
                11px;

            font-weight:
                800;

            letter-spacing:
                1.5px;

            text-transform:
                uppercase;

            margin-bottom:
                8px;

        }


        h1 {

            font-size:
                clamp(30px, 5vw, 48px);

            line-height:
                1.08;

            letter-spacing:
                -1.5px;

            margin-bottom:
                14px;

        }


        .hero p {

            max-width:
                760px;

            color:
                var(--muted);

            font-size:
                15px;

        }


        .hero-stats {

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                14px;

            margin-top:
                26px;

        }


        .stat {

            padding:
                17px;

            border:
                1px solid
                var(--border);

            border-radius:
                15px;

            background:
                rgba(255,255,255,0.025);

        }


        .stat strong {

            display:
                block;

            font-size:
                24px;

            margin-bottom:
                2px;

        }


        .stat span {

            color:
                var(--muted);

            font-size:
                12px;

        }


        /* --------------------------------------------------------------
           Controls
        -------------------------------------------------------------- */

        .controls {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            flex-wrap:
                wrap;

            margin-bottom:
                22px;

        }


        .search-box {

            flex:
                1 1 300px;

            position:
                relative;

        }


        .search-box input {

            width:
                100%;

            min-height:
                48px;

            padding:
                0 16px 0 44px;

            border:
                1px solid
                var(--border);

            border-radius:
                12px;

            background:
                var(--card);

            color:
                var(--text);

            outline:
                none;

        }


        .search-box input:focus {

            border-color:
                rgba(39,209,127,0.55);

        }


        .search-icon {

            position:
                absolute;

            left:
                15px;

            top:
                50%;

            transform:
                translateY(-50%);

            color:
                var(--muted);

            pointer-events:
                none;

        }


        .sort-select {

            min-height:
                48px;

            padding:
                0 14px;

            border:
                1px solid
                var(--border);

            border-radius:
                12px;

            background:
                var(--card);

            color:
                var(--text);

            outline:
                none;

            cursor:
                pointer;

        }


        .sort-select option {

            background:
                var(--card);

            color:
                var(--text);

        }


        /* --------------------------------------------------------------
           Country Grid
        -------------------------------------------------------------- */

        .section-heading {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                flex-end;

            gap:
                20px;

            margin-bottom:
                18px;

        }


        .section-heading h2 {

            font-size:
                24px;

            letter-spacing:
                -0.5px;

        }


        .section-heading p {

            color:
                var(--muted);

            font-size:
                13px;

            margin-top:
                3px;

        }


        .country-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(0, 1fr)
                );

            gap:
                14px;

        }


        .country-card {

            position:
                relative;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                14px;

            min-height:
                92px;

            padding:
                18px;

            border:
                1px solid
                var(--border);

            border-radius:
                16px;

            background:
                var(--card);

            transition:
                transform .2s ease,
                border-color .2s ease,
                background .2s ease;

        }


        .country-card:hover {

            transform:
                translateY(-3px);

            border-color:
                rgba(39,209,127,0.35);

            background:
                var(--card-hover);

        }


        .country-main {

            display:
                flex;

            align-items:
                center;

            gap:
                13px;

            min-width:
                0;

        }


        .country-flag {

            width:
                44px;

            height:
                44px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            flex-shrink:
                0;

            border:
                1px solid
                var(--border);

            border-radius:
                12px;

            background:
                rgba(39,209,127,0.08);

            font-size:
                23px;

        }


        .country-info {

            min-width:
                0;

        }


        .country-name {

            font-size:
                15px;

            font-weight:
                750;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        .country-count {

            color:
                var(--muted);

            font-size:
                12px;

            margin-top:
                2px;

        }


        .country-arrow {

            color:
                var(--green);

            font-size:
                20px;

            flex-shrink:
                0;

        }


        /* --------------------------------------------------------------
           Empty / Loading
        -------------------------------------------------------------- */

        .state-card {

            padding:
                42px 20px;

            text-align:
                center;

            border:
                1px solid
                var(--border);

            border-radius:
                18px;

            background:
                var(--card);

        }


        .spinner {

            width:
                30px;

            height:
                30px;

            margin:
                0 auto 14px;

            border:
                3px solid
                rgba(255,255,255,0.08);

            border-top-color:
                var(--green);

            border-radius:
                50%;

            animation:
                spin .8s linear infinite;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        .state-card h2 {

            font-size:
                19px;

            margin-bottom:
                5px;

        }


        .state-card p {

            color:
                var(--muted);

            font-size:
                13px;

        }


        .empty-state {

            padding:
                50px 20px;

            text-align:
                center;

            border:
                1px solid
                var(--border);

            border-radius:
                18px;

            background:
                var(--card);

        }


        .empty-state strong {

            display:
                block;

            margin-bottom:
                6px;

            font-size:
                18px;

        }


        .empty-state p {

            color:
                var(--muted);

            font-size:
                13px;

        }


        /* --------------------------------------------------------------
           Footer
        -------------------------------------------------------------- */

        footer {

            border-top:
                1px solid
                var(--border);

            padding:
                30px 0;

            text-align:
                center;

            color:
                var(--muted);

            font-size:
                13px;

        }


        footer a {

            color:
                var(--green);

        }


        .designed {

            margin-top:
                8px;

            font-size:
                12px;

            opacity:
                0.8;

        }


        /* --------------------------------------------------------------
           Responsive
        -------------------------------------------------------------- */

        @media (
            max-width:
            1000px
        ) {

            .country-grid {

                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );

            }

        }


        @media (
            max-width:
            768px
        ) {

            .desktop-nav {

                display:
                    none;

            }


            .mobile-toggle {

                display:
                    flex;

            }


            .page {

                padding:
                    28px 0 55px;

            }


            .hero {

                padding:
                    25px 20px;

            }


            .hero-stats {

                grid-template-columns:
                    1fr;

            }


            .country-grid {

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

            }

        }


        @media (
            max-width:
            480px
        ) {

            .container {

                width:
                    min(
                        94%,
                        1180px
                    );

            }


            .brand {

                font-size:
                    20px;

            }


            .brand img {

                width:
                    31px;

                height:
                    31px;

            }


            .hero {

                padding:
                    22px 16px;

                border-radius:
                    17px;

            }


            .country-grid {

                grid-template-columns:
                    1fr;

            }


            .country-card {

                min-height:
                    82px;

            }


            .controls {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .search-box {

                flex:
                    none;

            }


            .sort-select {

                width:
                    100%;

            }


            .section-heading {

                align-items:
                    flex-start;

            }

        }

    </style>

</head>
