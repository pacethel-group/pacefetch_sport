<style>
:root{
  --green:#00c389;
  --green-2:#00a978;
  --green-soft:rgba(0,195,137,.12);

  --dark:#061510;
  --dark-2:#091f18;
  --dark-3:#0d2921;

  --card:#0b211a;
  --card-2:#102a22;

  --text:#f3faf7;
  --muted:#91aaa2;

  --line:rgba(255,255,255,.09);

  --red:#ff5d6c;
  --yellow:#f4c95d;

  --white:#fff;

  --shadow:0 18px 50px rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
  max-width:100%;
  overflow-x:hidden;
}

body{
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(circle at 80% 0%,rgba(0,195,137,.08),transparent 30%),
    var(--dark);

  color:var(--text);

  min-height:100vh;

  max-width:100%;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
  display:block;
}


/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;

  height:70px;

  background:rgba(6,21,16,.94);
  backdrop-filter:blur(18px);

  border-bottom:1px solid var(--line);
}

.header-inner{
  width:min(1240px,calc(100% - 32px));
  height:100%;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;

  font-size:19px;
  font-weight:950;
  letter-spacing:-.5px;
}

.logo-mark{
  width:36px;
  height:36px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:linear-gradient(
    145deg,
    var(--green),
    var(--green-2)
  );

  color:#042018;

  font-weight:1000;
  font-size:17px;

  box-shadow:0 8px 25px rgba(0,195,137,.18);
}

.logo-text small{
  display:block;

  margin-top:-2px;

  color:var(--muted);

  font-size:7px;
  letter-spacing:1.7px;
  text-transform:uppercase;
}

.nav{
  display:flex;
  align-items:center;
  gap:5px;
}

.nav a{
  padding:9px 11px;

  border-radius:8px;

  color:var(--muted);

  font-size:12px;
  font-weight:750;

  transition:.2s;
}

.nav a:hover,
.nav a.active{
  color:var(--text);
  background:rgba(255,255,255,.055);
}

.nav a.active{
  color:var(--green);
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.clock{
  padding:7px 9px;

  border:1px solid var(--line);
  border-radius:8px;

  color:var(--muted);

  font-size:9px;
  font-weight:800;

  white-space:nowrap;
}

.search-btn{
  width:34px;
  height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid var(--line);
  border-radius:9px;

  background:rgba(255,255,255,.035);
  color:var(--text);

  font-size:16px;
}


/* =========================
   SEARCH
========================= */

.search-overlay{
  position:fixed;
  inset:0;

  z-index:2000;

  display:none;
  align-items:flex-start;
  justify-content:center;

  padding:110px 20px;

  background:rgba(2,10,7,.82);
  backdrop-filter:blur(12px);
}

.search-overlay.show{
  display:flex;
}

.search-box{
  width:min(650px,100%);

  background:var(--card);

  border:1px solid var(--line);
  border-radius:18px;

  padding:22px;

  box-shadow:var(--shadow);
}

.search-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.search-input{
  flex:1;

  min-width:0;

  border:1px solid var(--line);
  border-radius:10px;

  background:rgba(255,255,255,.04);

  color:var(--text);

  padding:13px 14px;

  outline:none;
}

.search-input:focus{
  border-color:rgba(0,195,137,.5);
}

.close-search{
  width:42px;
  height:42px;

  border:1px solid var(--line);
  border-radius:10px;

  background:rgba(255,255,255,.04);

  color:var(--text);
}


/* =========================
   MAIN
========================= */

.container{
  width:min(1240px,calc(100% - 32px));
  margin:auto;
}

main{
  padding:30px 0 100px;
}


/* =========================
   BREADCRUMB
========================= */

.breadcrumb{
  display:flex;
  align-items:center;
  gap:7px;

  color:var(--muted);

  font-size:10px;
  font-weight:700;

  margin-bottom:17px;
}

.breadcrumb a:hover{
  color:var(--green);
}


/* =========================
   PAGE HEADER
========================= */

.page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;

  margin-bottom:20px;
}

.page-head h1{
  font-size:clamp(27px,4vw,42px);
  line-height:1;
  letter-spacing:-1.5px;
}

.page-head p{
  max-width:580px;

  margin-top:9px;

  color:var(--muted);

  font-size:13px;
  line-height:1.6;
}


/* =========================
   HERO
========================= */

.prediction-hero{
  position:relative;
  overflow:hidden;

  padding:25px;

  margin-bottom:20px;

  border:1px solid rgba(0,195,137,.18);
  border-radius:18px;

  background:
    radial-gradient(
      circle at 85% 15%,
      rgba(0,195,137,.16),
      transparent 32%
    ),
    linear-gradient(
      135deg,
      #0d2a21,
      #081b15
    );

  box-shadow:var(--shadow);
}

.prediction-hero:after{
  content:"";

  position:absolute;

  width:170px;
  height:170px;

  right:-80px;
  bottom:-90px;

  border-radius:50%;

  border:1px solid rgba(0,195,137,.14);
}

.hero-label{
  color:var(--green);

  font-size:9px;
  font-weight:900;

  letter-spacing:1.5px;
  text-transform:uppercase;
}

.prediction-hero h2{
  margin-top:7px;

  font-size:clamp(22px,4vw,32px);

  letter-spacing:-1px;
}

.prediction-hero p{
  max-width:680px;

  margin-top:8px;

  color:var(--muted);

  font-size:12px;
  line-height:1.6;
}

.hero-stats{
  display:flex;
  flex-wrap:wrap;
  gap:10px;

  margin-top:18px;
}

.hero-stat{
  min-width:120px;

  padding:10px 13px;

  border:1px solid var(--line);
  border-radius:10px;

  background:rgba(255,255,255,.035);
}

.hero-stat strong{
  display:block;

  color:var(--text);

  font-size:18px;
}

.hero-stat span{
  display:block;

  margin-top:2px;

  color:var(--muted);

  font-size:8px;
  font-weight:800;

  text-transform:uppercase;
  letter-spacing:.5px;
}


/* =========================
   FILTERS
========================= */

.filters{
  display:flex;
  gap:7px;

  margin-bottom:17px;

  overflow-x:auto;

  padding-bottom:3px;

  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter-btn{
  flex:0 0 auto;

  padding:8px 12px;

  border:1px solid var(--line);
  border-radius:8px;

  background:rgba(255,255,255,.035);

  color:var(--muted);

  font-size:9px;
  font-weight:850;

  transition:.2s;
}

.filter-btn:hover,
.filter-btn.active{
  background:var(--green-soft);

  border-color:rgba(0,195,137,.3);

  color:var(--green);
}


/* =========================
   LAYOUT
========================= */

.prediction-layout{
  display:grid;

  grid-template-columns:minmax(0,1fr) 290px;

  gap:18px;

  align-items:start;
}


/* =========================
   SECTION
========================= */

.section-card{
  min-width:0;

  background:rgba(11,33,26,.82);

  border:1px solid var(--line);
  border-radius:15px;

  overflow:hidden;
}

.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;

  padding:15px 16px;

  border-bottom:1px solid var(--line);
}

.section-header h3{
  font-size:14px;
  letter-spacing:-.2px;
}

.section-header span{
  color:var(--muted);

  font-size:9px;
  font-weight:750;
}


/* =========================
   PREDICTION LIST
========================= */

.prediction-list{
  display:grid;
  gap:8px;

  padding:10px;
}


/* =========================================================
   IMPORTANT:
   ENTIRE MATCH IS ONE HORIZONTAL LINE
========================================================= */

.prediction-card{
  width:100%;
  min-width:0;

  background:
    linear-gradient(
      145deg,
      var(--card),
      #081b15
    );

  border:1px solid var(--line);

  border-radius:12px;

  overflow:hidden;

  transition:.2s ease;
}

.prediction-card:hover{
  border-color:rgba(0,195,137,.32);

  transform:translateY(-1px);
}

.prediction-card-inner{

  width:100%;
  min-width:0;

  min-height:70px;

  display:grid;

  align-items:center;

  /*
    TIME
    HOME
    VS
    AWAY
    PICK
    CONFIDENCE
    RISK
  */

  grid-template-columns:
    82px
    minmax(80px,1fr)
    24px
    minmax(80px,1fr)
    minmax(110px,1.2fr)
    58px
    62px;

  gap:8px;

  padding:9px 12px;
}


/* TIME */

.match-info{
  min-width:0;

  display:flex;
  flex-direction:column;

  gap:2px;
}

.match-info .league{
  color:var(--green);

  font-size:8px;
  font-weight:850;

  text-transform:uppercase;
  letter-spacing:.45px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.match-info .match-time{
  color:var(--text);

  font-size:11px;
  font-weight:850;

  white-space:nowrap;
}


/* TEAM */

.horizontal-team{
  min-width:0;

  color:var(--text);

  font-size:12px;
  font-weight:900;

  line-height:1.1;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.horizontal-team.away{
  text-align:left;
}


/* VS */

.horizontal-vs{
  width:24px;
  height:24px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:rgba(255,255,255,.065);

  border:1px solid var(--line);

  color:var(--muted);

  font-size:7px;
  font-weight:950;
}


/* PICK */

.horizontal-pick{
  min-width:0;
}

.horizontal-pick small,
.horizontal-confidence small,
.horizontal-risk small{
  display:block;

  margin-bottom:2px;

  color:var(--muted);

  font-size:7px;
  font-weight:800;

  text-transform:uppercase;
  letter-spacing:.3px;
}

.horizontal-pick strong{
  display:block;

  color:var(--green);

  font-size:10px;
  font-weight:950;

  line-height:1.1;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* CONFIDENCE */

.horizontal-confidence{
  min-width:0;

  text-align:center;
}

.horizontal-confidence strong{
  display:block;

  color:var(--text);

  font-size:11px;
  font-weight:950;
}

.horizontal-confidence .bar{
  width:48px;
  height:3px;

  margin:3px auto 0;

  background:rgba(255,255,255,.08);

  border-radius:10px;

  overflow:hidden;
}

.horizontal-confidence .bar i{
  display:block;

  height:100%;

  background:var(--green);

  border-radius:inherit;
}


/* RISK */

.horizontal-risk{
  min-width:0;

  text-align:center;
}

.horizontal-risk strong{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  padding:4px 6px;

  border-radius:6px;

  font-size:7px;
  font-weight:950;

  text-transform:uppercase;

  white-space:nowrap;
}

.risk-low{
  color:var(--green);

  background:rgba(0,195,137,.10);
}

.risk-medium{
  color:var(--yellow);

  background:rgba(244,201,93,.10);
}

.risk-high{
  color:var(--red);

  background:rgba(255,93,108,.10);
}


/* =========================
   SIDEBAR
========================= */

.sidebar{
  display:grid;
  gap:12px;
}

.side-card{
  padding:16px;

  background:rgba(11,33,26,.82);

  border:1px solid var(--line);
  border-radius:15px;
}

.side-card h3{
  font-size:13px;
}

.side-card p{
  margin-top:7px;

  color:var(--muted);

  font-size:10px;
  line-height:1.6;
}


/* RECORD */

.record-main{
  display:flex;
  align-items:flex-end;
  gap:10px;

  margin-top:15px;
}

.record-main strong{
  font-size:30px;
  line-height:1;
}

.record-main span{
  color:var(--green);

  font-size:11px;
  font-weight:850;
}

.record-bar{
  height:6px;

  margin-top:12px;

  background:rgba(255,255,255,.06);

  border-radius:20px;

  overflow:hidden;
}

.record-bar i{
  display:block;

  width:76%;

  height:100%;

  background:var(--green);

  border-radius:inherit;
}


/* GUIDE */

.guide-item{
  display:flex;
  gap:10px;

  padding:10px 0;

  border-bottom:1px solid var(--line);
}

.guide-item:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.guide-number{
  flex:0 0 25px;

  width:25px;
  height:25px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:7px;

  background:var(--green-soft);

  color:var(--green);

  font-size:9px;
  font-weight:950;
}

.guide-item strong{
  display:block;

  font-size:10px;
}

.guide-item span{
  display:block;

  margin-top:3px;

  color:var(--muted);

  font-size:8px;
  line-height:1.4;
}


/* =========================
   CALENDAR
========================= */

.calendar{
  padding:15px;
}

.calendar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:12px;
}

.calendar-head button{
  width:29px;
  height:29px;

  border:1px solid var(--line);
  border-radius:7px;

  background:rgba(255,255,255,.035);

  color:var(--text);
}

.calendar-head strong{
  font-size:11px;
}

.calendar-week{
  display:grid;
  grid-template-columns:repeat(7,1fr);

  margin-bottom:5px;
}

.calendar-week span{
  text-align:center;

  color:var(--muted);

  font-size:7px;
  font-weight:800;
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);

  gap:4px;
}

.calendar-day{
  min-height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid transparent;
  border-radius:7px;

  background:rgba(255,255,255,.025);

  color:var(--muted);

  font-size:8px;
  font-weight:800;

  cursor:pointer;

  transition:.2s;
}

.calendar-day:hover{
  border-color:rgba(0,195,137,.3);
  color:var(--green);
}

.calendar-day.today{
  border-color:rgba(0,195,137,.4);
  color:var(--green);
}

.calendar-day.selected{
  background:var(--green);
  color:#042018;
}

.calendar-day.empty{
  background:transparent;
  cursor:default;
}


/* =========================
   DAILY SUMMARY
========================= */

.daily-summary{
  margin-top:12px;

  padding:12px;

  border-radius:10px;

  background:rgba(255,255,255,.035);

  border:1px solid var(--line);
}

.daily-summary-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.daily-summary strong{
  font-size:17px;
}

.daily-summary span{
  color:var(--green);

  font-size:9px;
  font-weight:850;
}

.daily-summary p{
  margin-top:5px;

  color:var(--muted);

  font-size:8px;
}


/* =========================
   FOOTER
========================= */

.footer{
  padding:45px 0 100px;

  border-top:1px solid var(--line);

  background:#04100c;
}

.footer-inner{
  width:min(1240px,calc(100% - 32px));
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.footer-brand{
  color:var(--muted);

  font-size:10px;
}

.footer-links{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
}

.footer-links a{
  color:var(--muted);

  font-size:9px;
}

.footer-links a:hover{
  color:var(--green);
}


/* PACETHEL */

.designed{
  width:100%;

  margin-top:28px;

  text-align:center;

  color:var(--muted);

  font-size:9px;
  letter-spacing:.8px;
}

.designed span{
  display:inline-block;

  color:var(--green);

  font-weight:900;

  animation:pacethelGlow 2.8s ease-in-out infinite;
}

@keyframes pacethelGlow{

  0%,100%{
    opacity:.65;
    transform:translateY(0);
    text-shadow:0 0 0 rgba(0,195,137,0);
  }

  50%{
    opacity:1;
    transform:translateY(-2px);
    text-shadow:
      0 0 12px rgba(0,195,137,.28);
  }
}


/* =========================
   MOBILE BOTTOM NAV
========================= */

.mobile-nav{
  display:none;

  position:fixed;

  left:10px;
  right:10px;
  bottom:10px;

  z-index:1500;

  padding:7px;

  border:1px solid var(--line);
  border-radius:15px;

  background:rgba(6,21,16,.95);

  backdrop-filter:blur(18px);

  box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.mobile-nav a{
  flex:1;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;

  padding:6px 3px;

  color:var(--muted);

  font-size:7px;
  font-weight:800;
}

.mobile-nav a.active{
  color:var(--green);
}

.mobile-nav-icon{
  font-size:14px;
}


/* =========================
   TABLET
========================= */

@media(max-width:1000px){

  .nav a{
    padding:8px 7px;
    font-size:10px;
  }

  .prediction-layout{
    grid-template-columns:minmax(0,1fr);
  }

  .sidebar{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

}


/* =========================
   900px
========================= */

@media(max-width:900px){

  .prediction-card-inner{
    grid-template-columns:
      68px
      minmax(65px,1fr)
      21px
      minmax(65px,1fr)
      minmax(90px,1.1fr)
      50px
      54px;

    gap:6px;

    padding:8px;
  }

  .horizontal-team{
    font-size:10px;
  }

  .horizontal-pick strong{
    font-size:9px;
  }

  .match-info .match-time{
    font-size:9px;
  }

}


/* =========================
   700px
========================= */

@media(max-width:700px){

  .header{
    height:60px;
  }

  .header-inner{
    width:calc(100% - 20px);
  }

  .logo{
    font-size:15px;
  }

  .logo-mark{
    width:31px;
    height:31px;

    border-radius:9px;

    font-size:14px;
  }

  .logo-text small{
    display:none;
  }

  .nav{
    display:none;
  }

  .clock{
    display:none;
  }

  main{
    padding-top:22px;
    padding-bottom:95px;
  }

  .container{
